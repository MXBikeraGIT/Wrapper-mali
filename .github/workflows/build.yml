name: Build Leegao Wrapper (Mali Workarounds)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout leegao wrapper source
        uses: actions/checkout@v4
        with:
          repository: leegao/bionic-vulkan-wrapper
          ref: wrapper

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip meson ninja-build git cmake
          pip3 install mako

      - name: Setup Android NDK (r28)
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28

      - name: Apply Mali workarounds
        run: |
          # Targeting the correct file path: src/vulkan/wrapper/wrapper_physical_device.c
          sed -i '/if (res != VK_SUCCESS)/a \
          \    if (strstr(phys_dev->device_props.deviceName, "Mali")) {\
          \        if (phys_dev->device_props.limits.maxStorageBufferRange > 128 * 1024 * 1024)\
          \            phys_dev->device_props.limits.maxStorageBufferRange = 128 * 1024 * 1024;\
          \        phys_dev->features.features.shaderStorageBufferArrayDynamicIndexing = VK_TRUE;\
          \    }' src/vulkan/wrapper/wrapper_physical_device.c

      - name: Configure Mesa
        run: |
          export ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}
          meson setup build \
            --cross-file cross_files/android-aarch64 \
            -Dplatforms=android \
            -Dvulkan-drivers=wrap \
            -Dbuildtype=release

      - name: Compile
        run: ninja -C build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper
          # Ensure this path matches the actual output location in the wrapper branch
          path: build/src/vulkan/wrapper/libvulkan_wrapper.so
