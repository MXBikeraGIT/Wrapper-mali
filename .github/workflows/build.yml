name: Build Leegao Wrapper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: leegao/bionic-vulkan-wrapper
          ref: main

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip meson ninja-build git cmake
          # Mako is required by Mesa's build system for generating code
          pip3 install mako

      - name: Setup Android NDK (r28)
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28

      - name: Configure Mesa
        run: |
          export ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}
          # Use the repository's native cross-file for Android
          meson setup build \
            --cross-file cross_files/android-aarch64 \
            -Dplatforms=android \
            -Dvulkan-drivers=wrap \
            -Dbuildtype=release

      - name: Compile
        run: ninja -C build

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper
          path: build/src/vulkan/wrap/libvulkan_wrapper.so
