name: Build Bionic Vulkan Wrapper

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies & Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            ninja-build \
            bison \
            flex \
            python3-mako \
            python3-yaml \
            g++-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            zstd \
            libvulkan-dev
          
          # Upgrade Meson via PyPI to get Meson >= 1.4.0 required by Mesa 25.2
          pip3 install --upgrade meson

      - name: Clone Mesa 25.2
        run: |
          git clone --depth 1 --branch 25.2 https://gitlab.freedesktop.org/mesa/mesa.git mesa

      - name: Inject Wrapper & Patch Mesa Tree
        run: |
          if [ -f "mesa/meson.options" ]; then
            OPTIONS_FILE="mesa/meson.options"
          elif [ -f "mesa/meson_options.txt" ]; then
            OPTIONS_FILE="mesa/meson_options.txt"
          else
            echo "::error::Could not find meson.options or meson_options.txt in Mesa tree!"
            exit 1
          fi

          echo "Found options file: ${OPTIONS_FILE}"

          sed -i "s/'swrast'/'swrast', 'wrapper'/g" "${OPTIONS_FILE}"

          mkdir -p mesa/src/vulkan/drivers/wrapper
          cp -r src/* mesa/src/vulkan/drivers/wrapper/
          if [ -d "include" ]; then cp -r include/* mesa/src/vulkan/drivers/wrapper/; fi
          cp cross_aarch64.txt mesa/

      - name: Configure Mesa Build
        run: |
          cd mesa
          meson setup build \
            --cross-file cross_aarch64.txt \
            --buildtype release \
            -Dplatforms=x11,wayland \
            -Dgallium-drivers="" \
            -Dvulkan-drivers="wrapper" \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dtools="" \
            -Dbuild-tests=false

      - name: Compile Shared Library with Ninja
        run: |
          cd mesa
          ninja -C build src/vulkan/drivers/wrapper/libvulkan_wrapper.so
          
          mkdir -p ../usr/lib
          cp build/src/vulkan/drivers/wrapper/libvulkan_wrapper.so ../usr/lib/libvulkan_wrapper.so

      - name: Package Archive
        run: |
          tar -I 'zstd --ultra -22' -cvf wrapper.tzst usr/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper
          path: |
            usr/lib/libvulkan_wrapper.so
            wrapper.tzst

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        with:
          tag_name: "testing"
          name: "Nightly / Testing Build"
          body: "Automated build with Mesa 25.2 NIR/SPIR-V shader rewriting and Vulkan dispatch tables."
          draft: false
          prerelease: true
          files: |
            usr/lib/libvulkan_wrapper.so
            wrapper.tzst
