name: Build and Package Vulkan Wrapper

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Compiler Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build g++-aarch64-linux-gnu

      - name: Compile libvulkan_wrapper.so
        run: |
          mkdir -p usr/lib
          aarch64-linux-gnu-g++ -shared -fPIC -O3 src/vulkan_wrapper.cpp -o usr/lib/libvulkan_wrapper.so

      - name: Upload Vulkan Wrapper Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-wrapper-so
          path: usr/lib/libvulkan_wrapper.so

  build-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Compiler Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu

      - name: Compile libmain_hook.so
        run: |
          mkdir -p usr/lib
          aarch64-linux-gnu-g++ -shared -fPIC -O3 src/main_hook.cpp -Iinclude -ldl -o usr/lib/libmain_hook.so

      - name: Upload Main Hook Artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-hook-so
          path: usr/lib/libmain_hook.so

  package-tzst:
    needs: [build-wrapper, build-hook]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Compression Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd tar

      - name: Download Wrapper Artifact
        uses: actions/download-artifact@v4
        with:
          name: vulkan-wrapper-so
          path: usr/lib/

      - name: Download Hook Artifact
        uses: actions/download-artifact@v4
        with:
          name: main-hook-so
          path: usr/lib/

      - name: Generate ICD Manifest
        run: |
          mkdir -p usr/share/vulkan/icd.d
          cat << 'EOF' > usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF

      - name: Create wrapper.tzst
        run: |
          export COPYFILE_DISABLE=1
          tar --exclude='._*' \
              --exclude='.DS_Store' \
              --exclude='PaxHeader' \
              -caf wrapper.tzst usr/

      - name: Place wrapper.tzst into usr/lib/
        run: |
          mv wrapper.tzst usr/lib/
          ls -la usr/lib/

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-wrapper-tzst-release
          path: usr/lib/
