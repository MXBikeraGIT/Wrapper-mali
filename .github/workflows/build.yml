name: Build Android Vulkan Wrapper

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Meson and Ninja
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d

      - name: Generate Meson ARM64 Cross-File
        run: |
          cat << 'EOF' > android-aarch64.ini
          [constants]
          ndk_path = '${{ steps.setup-ndk.outputs.ndk-path }}'
          toolchain = ndk_path + '/toolchains/llvm/prebuilt/linux-x86_64/bin'
          api_level = '29'

          [binaries]
          c = toolchain + '/aarch64-linux-android' + api_level + '-clang'
          cpp = toolchain + '/aarch64-linux-android' + api_level + '-clang++'
          ar = toolchain + '/llvm-ar'
          strip = toolchain + '/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      - name: Configure Meson Build Directory
        run: meson setup build --cross-file android-aarch64.ini

      - name: Compile Shared Library
        run: meson compile -C build

      - name: Upload libvulkan_wrapper.so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper.so
          path: build/libvulkan_wrapper.so
