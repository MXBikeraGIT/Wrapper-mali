name: Build Bionic Vulkan Wrapper

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Multiarch & Install Dependencies
        run: |
          # 1. Enable ARM64 architecture
          sudo dpkg --add-architecture arm64

          # 2. Restrict Ubuntu 24.04 DEB822 default sources to x86
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/Types: deb/Types: deb\nArchitectures: amd64 i386/' /etc/apt/sources.list.d/ubuntu.sources
          fi

          # Restrict legacy sources.list if present
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's/deb http/deb [arch=amd64,i386] http/g' /etc/apt/sources.list
          fi

          # 3. Add ARM64 ports repository
          UBUNTU_CODENAME=$(lsb_release -cs)
          sudo bash -c "cat <<EOF > /etc/apt/sources.list.d/arm64.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${UBUNTU_CODENAME} main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${UBUNTU_CODENAME}-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${UBUNTU_CODENAME}-security main restricted universe multiverse
          EOF"

          # 4. Update APT and install dependencies
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            ninja-build \
            bison \
            flex \
            python3-mako \
            python3-yaml \
            g++-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            zstd \
            libwayland-bin \
            wayland-protocols \
            libvulkan-dev:arm64 \
            libdrm-dev:arm64 \
            libwayland-dev:arm64 \
            libx11-dev:arm64 \
            libxcb1-dev:arm64 \
            libx11-xcb-dev:arm64 \
            libxrandr-dev:arm64 \
            libxcb-randr0-dev:arm64 \
            libxcb-shm0-dev:arm64 \
            libxcb-sync-dev:arm64 \
            libxcb-xfixes0-dev:arm64 \
            libxcb-dri3-dev:arm64 \
            libxcb-present-dev:arm64 \
            libxshmfence-dev:arm64

          # 5. Upgrade Meson via PyPI
          pip3 install --upgrade meson --break-system-packages || pip3 install --upgrade meson

      - name: Create Cross Pkg-Config Wrapper
        run: |
          sudo bash -c 'cat << "EOF" > /usr/local/bin/aarch64-linux-gnu-pkg-config
          #!/bin/sh
          export PKG_CONFIG_DIR=""
          export PKG_CONFIG_LIBDIR="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="/"
          exec pkg-config "$@"
          EOF'
          sudo chmod +x /usr/local/bin/aarch64-linux-gnu-pkg-config

      - name: Clone Mesa 25.2
        run: |
          git clone --depth 1 --branch 25.2 https://gitlab.freedesktop.org/mesa/mesa.git mesa

      - name: Inject Wrapper & Patch Mesa Tree
        run: |
          # 1. Allow 'wrapper' in options array
          if [ -f "mesa/meson.options" ]; then
            OPTIONS_FILE="mesa/meson.options"
          elif [ -f "mesa/meson_options.txt" ]; then
            OPTIONS_FILE="mesa/meson_options.txt"
          else
            echo "::error::Could not find meson.options in Mesa tree!"
            exit 1
          fi

          sed -i "s/'swrast'/'swrast', 'wrapper'/g" "${OPTIONS_FILE}"

          # 2. Patch src/vulkan/meson.build
          VULKAN_MESON="mesa/src/vulkan/meson.build"
          if [ -f "${VULKAN_MESON}" ]; then
            echo "" >> "${VULKAN_MESON}"
            echo "if with_vulkan_drivers.contains('wrapper')" >> "${VULKAN_MESON}"
            echo "  subdir('wrapper')" >> "${VULKAN_MESON}"
            echo "endif" >> "${VULKAN_MESON}"
          else
            echo "::error::Could not find src/vulkan/meson.build!"
            exit 1
          fi

          # 3. Copy source files to mesa/src/vulkan/wrapper/
          mkdir -p mesa/src/vulkan/wrapper
          cp -r src/* mesa/src/vulkan/wrapper/
          if [ -d "include" ]; then cp -r include/* mesa/src/vulkan/wrapper/; fi
          cp cross_aarch64.txt mesa/

      - name: Configure Mesa Build
        run: |
          cd mesa
          meson setup build \
            --cross-file cross_aarch64.txt \
            --buildtype release \
            -Dplatforms=x11,wayland \
            -Dgallium-drivers="" \
            -Dvulkan-drivers="wrapper" \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dtools="" \
            -Dbuild-tests=false

      - name: Compile Shared Library with Ninja
        run: |
          cd mesa
          ninja -C build

          mkdir -p ../usr/lib
          FOUND_LIB=$(find build -name "libvulkan_wrapper.so" | head -n 1)

          if [ -n "$FOUND_LIB" ]; then
            echo "Found compiled library at: $FOUND_LIB"
            cp "$FOUND_LIB" ../usr/lib/libvulkan_wrapper.so
          else
            echo "::error::libvulkan_wrapper.so was not generated by Ninja!"
            exit 1
          fi

      - name: Package Archive
        run: |
          tar -I 'zstd --ultra -22' -cvf wrapper.tzst usr/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper
          path: |
            usr/lib/libvulkan_wrapper.so
            wrapper.tzst

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        with:
          tag_name: "testing"
          name: "Nightly / Testing Build"
          body: "Automated build with Mesa 25.2 NIR/SPIR-V shader rewriting and Vulkan dispatch tables."
          draft: false
          prerelease: true
          files: |
            usr/lib/libvulkan_wrapper.so
            wrapper.tzst
